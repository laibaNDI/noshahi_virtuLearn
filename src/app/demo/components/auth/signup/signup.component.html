<div class="surface-ground flex align-items-center justify-content-center min-h-screen min-w-screen overflow-hidden">
    <div class="flex flex-column align-items-center justify-content-center">
        <img src="assets/layout/images/{{layoutService.config().colorScheme === 'light' ? 'logo-dark' : 'logo-white'}}.svg" alt="Logo" class="mb-5 w-6rem flex-shrink-0">   

        <div style="border-radius:56px; padding:0.3rem; background: linear-gradient(180deg, var(--primary-color) 10%, rgba(33, 150, 243, 0) 30%);">
            <div class="w-full surface-card py-8 px-5 sm:px-8" style="border-radius:53px">
                <div class="text-center mb-5">
                    <img src="assets/demo/images/login/avatar.png" alt="Avatar" height="50" class="mb-3">
                    <div class="text-900 text-3xl font-medium mb-3">Sign Up for Noshahi VirtuLearn</div>
                    <span class="text-600 font-medium">Create your account</span>
                </div>

                <div>
                    <label for="firstName" class="block text-900 text-xl font-medium mb-2">First Name</label>
                    <input id="firstName" type="text" [(ngModel)]="firstName" placeholder="Enter First Name" pInputText class="w-full md:w-30rem mb-5" style="padding:1rem">

                    <label for="lastName" class="block text-900 text-xl font-medium mb-2">Last Name</label>
                    <input id="lastName" type="text" [(ngModel)]="lastName" placeholder="Enter Last Name" pInputText class="w-full md:w-30rem mb-5" style="padding:1rem">

                    <label for="email" class="block text-900 text-xl font-medium mb-2">Email</label>
                    <input id="email" type="email" [(ngModel)]="email" placeholder="Enter Email" pInputText class="w-full md:w-30rem mb-5" style="padding:1rem">

                    <label for="password" class="block text-900 font-medium text-xl mb-2">Password</label>
                    <p-password id="password" [(ngModel)]="password" placeholder="Enter Password" [toggleMask]="true" inputStyleClass="w-full p-3 md:w-30rem" styleClass="mb-5"></p-password>

                    <label for="role" class="block text-900 text-xl font-medium mb-2">Role</label>
                    <p-dropdown 
                        id="role" 
                        [(ngModel)]="role" 
                        [options]="roles" 
                        optionLabel="label" 
                        placeholder="Select Role"
                        class="w-full md:w-30rem mb-5">
                    </p-dropdown>

                    <button pButton pRipple label="Sign Up" class="w-full p-3 text-xl" (click)="onSignUp()"></button>

                    <p *ngIf="error" class="text-red-500 mt-3 text-center">{{ error }}</p>
                </div>
            </div>
        </div>
    </div>
</div>
