<div class="enroll-container">
  <h2>Course Enrollment</h2>
  
  <form (ngSubmit)="enroll()">
    <label for="firstName">First Name:</label>
    <input type="text" id="firstName" [(ngModel)]="enrollmentData.firstName" name="firstName" required>

    <label for="lastName">Last Name:</label>
    <input type="text" id="lastName" [(ngModel)]="enrollmentData.lastName" name="lastName" required>

    <label for="email">Email Address:</label>
    <input type="email" id="email" [(ngModel)]="enrollmentData.email" name="email" required>

    <label for="role">Role:</label>
    <select id="role" [(ngModel)]="enrollmentData.role" name="role" required>
      <option value="">Select Role</option>
      <option *ngFor="let role of roles" [value]="role.value">{{ role.label }}</option>
    </select>

    <div *ngIf="showRoleWarning" class="warning">Please select a role to enroll.</div>
    
    <button type="submit">Enroll</button>
  </form>

  <div *ngIf="showPopup" class="popup">
    <div class="popup-content">
      <h3>Enrollment Successful</h3>
      <p>Thank you for enrolling in Noshahi VirtuLearn!</p>
      <button (click)="closePopup()">OK</button>
    </div>
  </div>
</div>
