<div class="student-container">
    <div class="header">
      <h2>Student Management</h2>
      <div class="actions">
        <input type="text" placeholder="Search..." (input)="applyFilter($event)" />
        <select (change)="applyFilter($event)">
          <option value="">All Grades</option>
          <option value="6">Grade 6</option>
          <option value="7">Grade 7</option>
          <option value="8">Grade 8</option>
        </select>
        <button (click)="openAddStudentModal()">Add Student</button>
      </div>
    </div>
  
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Grade</th>
          <th>Enrollment Date</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let student of filteredStudents">
          <td>{{ student.name }}</td>
          <td>{{ student.grade }}</td>
          <td>{{ student.enrollmentDate }}</td>
          <td>
            <button (click)="editStudent(student)">Edit</button>
            <button class="delete-btn" (click)="confirmDeleteStudent(student)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  
  <!-- Add/Edit Student Modal -->
  <div class="modal" *ngIf="displayStudentModal">
    <div class="modal-content">
      <h3>{{ isEditStudent ? 'Edit Student' : 'Add Student' }}</h3>
      <form (submit)="saveStudent($event)">
        <label>Name</label>
        <input type="text" #nameInput required />
  
        <label>Grade</label>
        <select #gradeInput required>
          <option value="6">Grade 6</option>
          <option value="7">Grade 7</option>
          <option value="8">Grade 8</option>
        </select>
  
        <label>Enrollment Date</label>
        <input type="date" #dateInput required />
  
        <button type="submit">Save</button>
        <button type="button" (click)="closeModal()">Cancel</button>
      </form>
    </div>
  </div>
  
  <!-- Delete Confirmation Dialog -->
  <div class="modal" *ngIf="displayDeleteConfirm">
    <div class="modal-content">
      <h3>Are you sure you want to delete this student?</h3>
      <button (click)="deleteStudent()">Yes</button>
      <button (click)="displayDeleteConfirm = false">No</button>
    </div>
  </div>
